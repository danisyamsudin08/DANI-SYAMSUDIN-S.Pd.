<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Voting Mas dan Mbak Molas 2026 - SMP Negeri 15 Semarang</title>
  <meta name="description" content="Aplikasi E-Voting pemilihan Mas dan Mbak Molas 2026 SMP Negeri 15 Semarang berbasis Supabase, Tailwind CSS, SheetJS, dan Chart.js dengan dukungan tablet dan desktop." />
  <meta property="og:title" content="E-Voting Mas dan Mbak Molas 2026 - SMP Negeri 15 Semarang" />
  <meta property="og:description" content="Aplikasi E-Voting resmi SMP Negeri 15 Semarang" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0b192c',
              dark: '#1e293b',
              blue: '#1d4ed8',
              sky: '#0284c7',
              gold: '#d97706',
              goldlight: '#fef3c7',
              accent: '#f59e0b'
            }
          },
          screens: {
            'tab': '1080px'
          }
        }
      }
    }
  </script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS (XLSX) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-amber-100 selection:text-amber-900">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Main Navigation Header -->
  <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white shadow-lg sticky top-0 z-40 border-b border-amber-500/30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Logo & Title -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="appState.navigate('landing')">
          <div id="header-logo-container" class="relative w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center shadow-md shadow-amber-500/20 text-slate-950 p-1 border-2 border-amber-300 overflow-hidden">
            <!-- Emblem Molas 15 default or custom image -->
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-slate-950">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span class="absolute -bottom-1 -right-1 bg-blue-700 text-amber-300 text-[9px] font-black px-1.5 py-0.5 rounded shadow">15</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 id="header-title" class="font-extrabold text-lg sm:text-xl tracking-tight text-white flex items-center gap-1.5">
                E-Voting Mas & Mbak Molas 2026
              </h1>
              <span id="header-badge" class="hidden sm:inline-block bg-amber-400 text-slate-950 text-xs font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Molas Fest</span>
            </div>
            <p id="header-subtitle" class="text-xs text-blue-200 font-medium">SMP Negeri 15 Semarang &bull; Mandiri, Unggul, Berkarakter</p>
          </div>
        </div>

        <!-- Right Header Actions -->
        <div class="flex items-center gap-3">
          <!-- Backend Connection Status Pill -->
          <button onclick="appState.openSupabaseConfig()" class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium border transition-colors" id="db-status-pill">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" id="db-status-dot"></span>
            <span id="db-status-text">Simulasi Lokal</span>
            <i data-lucide="database" class="w-3.5 h-3.5 opacity-70"></i>
          </button>

          <!-- Admin Button or User Info -->
          <div id="nav-user-actions" class="flex items-center gap-2">
            <!-- Dynamic inject by JS -->
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex flex-col justify-start">
    <div id="app-view" class="w-full">
      <!-- Views will be dynamically rendered here -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 text-xs py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-semibold text-slate-300">SMP Negeri 15 Semarang</span>
        <span>&bull;</span>
        <span>Jl. Suratmo No. 1, Manyaran, Semarang Barat</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="footer-copyright">&copy; 2026 SMP Negeri 15 Semarang. All Rights Reserved.</span>
        <button onclick="appState.downloadStandaloneHtml()" class="text-amber-400 hover:text-amber-300 underline font-medium flex items-center gap-1">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> Unduh File HTML Tunggal
        </button>
      </div>
    </div>
  </footer>

  <!-- Global Modals Container -->
  <div id="modal-container"></div>

  <!-- App Core Script -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
